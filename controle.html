<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrôle - Dictée Marianne</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}main{width:min(1050px,calc(100% - 24px));margin:24px auto}section{background:#fff;border:1px solid #dce1e6;border-radius:16px;padding:20px;box-shadow:0 10px 28px rgba(0,0,0,.06)}h1{margin-top:0}.row{display:flex;gap:8px}input{flex:1;padding:12px;border:1px solid #bbc3cc;border-radius:9px;font-size:1rem}button{padding:12px 16px;border:0;border-radius:9px;background:#a71930;color:#fff;font-weight:800}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px;border-bottom:1px solid #e2e6ea;text-align:left}.yes{color:#19703a;font-weight:800}.no{color:#8b1e2d;font-weight:800}@media(max-width:700px){.row{display:block}button,input{width:100%}button{margin-top:8px}table{font-size:.88rem}}</style></head><body><main><section><h1>Suivi de lecture - Dictée Marianne</h1><p>Groupe 51 - 2 octobre 2026</p><form id="form"><div class="row"><input id="pwd" type="password" required placeholder="Mot de passe enseignant"><button>Afficher / actualiser</button></div></form><p id="msg"></p><div id="out"></div></section></main><script>const ENDPOINT="https://ojyswaxuqwnqilrvtjll.supabase.co/functions/v1/marianne-dictee"; const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qeXN3YXh1cXducWlscnZ0amxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MDI0MTksImV4cCI6MjEwNDM3ODQxOX0.zKiE9TgFhH0W0Y_4qL_o16csdDqq9TiacHiCcf6ES3Q';const f=document.querySelector('#form'),p=document.querySelector('#pwd'),m=document.querySelector('#msg'),o=document.querySelector('#out');function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}f.addEventListener('submit',async ev=>{ev.preventDefault();m.textContent='Chargement…';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify({action:'control',password:p.value})});const d=await r.json();if(!d.ok)throw new Error(d.message);const read=d.students.filter(x=>x.read).length;m.textContent=`${read} / ${d.students.length} élèves ont entré leur mot.`;o.innerHTML=`<table><thead><tr><th>Élève</th><th>Note</th><th>Commentaires lus</th><th>Première lecture</th><th>Ouvertures</th></tr></thead><tbody>${d.students.map(s=>`<tr><td>${e(s.first+' '+s.last)}</td><td>${s.note}/30</td><td class="${s.read?'yes':'no'}">${s.read?'Oui':'Non'}</td><td>${s.read_at?new Date(s.read_at).toLocaleString('fr-CA'):'-'}</td><td>${s.read_count||0}</td></tr>`).join('')}</tbody></table>`}catch(err){m.textContent=err.message;o.innerHTML=''}});</script></body></html>
