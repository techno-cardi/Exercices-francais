<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#a71930">
<title>Contrôle - Dictée Marianne</title>
<style>
:root{--red:#a71930;--ink:#18212b;--muted:#66717e;--bg:#f3f5f7;--card:#fff;--line:#dbe1e6;--green:#207246;--amber:#9a6400}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
main{width:min(1180px,calc(100% - 22px));margin:22px auto 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 12px 34px rgba(20,30,40,.07)}
h1{margin:0 0 5px}.sub{margin:0;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:18px}input{flex:1;padding:12px 13px;border:1px solid #bdc6ce;border-radius:10px;font-size:1rem}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{border:1px solid var(--line);background:#fafbfc;border-radius:13px;padding:13px}.stat strong{display:block;font-size:1.55rem}.stat span{color:var(--muted);font-size:.88rem}
.table-wrap{overflow:auto;margin-top:18px;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;background:#fff;min-width:900px}
th,td{padding:10px 11px;border-bottom:1px solid #e6eaee;text-align:left;white-space:nowrap}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:#607080;background:#f8fafb;position:sticky;top:0}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:.78rem;font-weight:850}.yes{background:#e9f6ee;color:#17613a}.no{background:#f7ecee;color:#851f30}.mid{background:#fff4df;color:#855800}
.progress{width:130px;height:8px;border-radius:999px;background:#e5e9ed;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:7px}.progress>i{display:block;height:100%;background:#26754a}
#msg{min-height:24px;color:#8a1c2d;font-weight:650}.name{font-weight:800}
@media(max-width:700px){.row{display:block}button,input{width:100%}button{margin-top:8px}.stats{grid-template-columns:1fr 1fr}.panel{padding:15px}}
</style>
</head>
<body>
<main>
<section class="panel">
<h1>Suivi du devoir - Dictée « Marianne »</h1>
<p class="sub">Groupe 51 - 2 octobre 2026</p>
<form id="form"><div class="row"><input id="pwd" type="password" required placeholder="Mot de passe enseignant"><button>Afficher / actualiser</button></div></form>
<p id="msg"></p>
<div id="stats" class="stats" hidden></div>
<div id="out"></div>
</section>
</main>
<script>
const BASE='https://ojyswaxuqwnqilrvtjll.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qeXN3YXh1cXducWlscnZ0amxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MDI0MTksImV4cCI6MjEwNDM3ODQxOX0.zKiE9TgFhH0W0Y_4qL_o16csdDqq9TiacHiCcf6ES3Q';
const HEAD={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};
const f=document.querySelector('#form'),p=document.querySelector('#pwd'),m=document.querySelector('#msg'),o=document.querySelector('#out'),stats=document.querySelector('#stats');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(name,payload){const r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:HEAD,body:JSON.stringify(payload)});if(!r.ok)throw new Error('Impossible de joindre le service.');return await r.json();}
f.addEventListener('submit',async ev=>{
  ev.preventDefault();m.textContent='Chargement…';o.innerHTML='';stats.hidden=true;
  try{
    const d=await rpc('marianne_control',{p_password:p.value});
    if(!d.ok)throw new Error(d.message||'Accès refusé.');
    const a=d.students||[];
    const copies=a.filter(x=>x.copyOpened).length;
    const allErrors=a.filter(x=>x.understoodCount===x.totalErrors).length;
    const completed=a.filter(x=>x.completed).length;
    const started=a.filter(x=>x.copyOpened||x.understoodCount>0||x.completed).length;
    stats.innerHTML=
      '<div class="stat"><strong>'+started+'/'+a.length+'</strong><span>ont commencé</span></div>'+
      '<div class="stat"><strong>'+copies+'/'+a.length+'</strong><span>ont ouvert leur copie</span></div>'+
      '<div class="stat"><strong>'+allErrors+'/'+a.length+'</strong><span>ont traité toutes leurs erreurs</span></div>'+
      '<div class="stat"><strong>'+completed+'/'+a.length+'</strong><span>ont validé le mot caché</span></div>';
    stats.hidden=false;
    m.textContent=completed+' / '+a.length+' devoirs complétés.';
    o.innerHTML='<div class="table-wrap"><table><thead><tr><th>Élève</th><th>Note</th><th>Copie ouverte</th><th>Erreurs comprises</th><th>Validation finale</th><th>Moment de validation</th></tr></thead><tbody>'+
      a.map(s=>{
        const pct=s.totalErrors?Math.round(s.understoodCount/s.totalErrors*100):100;
        const progress='<span class="progress"><i style="width:'+pct+'%"></i></span>'+s.understoodCount+'/'+s.totalErrors;
        const final=s.completed?'<span class="badge yes">Complété</span>':(s.understoodCount||s.copyOpened?'<span class="badge mid">En cours</span>':'<span class="badge no">Non commencé</span>');
        return '<tr><td class="name">'+e(s.first+' '+s.last)+'</td><td>'+s.note+'/30</td><td>'+(s.copyOpened?'<span class="badge yes">Oui</span>':'<span class="badge no">Non</span>')+'</td><td>'+progress+'</td><td>'+final+'</td><td>'+(s.readAt?new Date(s.readAt).toLocaleString('fr-CA'):'-')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }catch(err){m.textContent=err.message;o.innerHTML='';stats.hidden=true}
});
</script>
</body>
</html>
