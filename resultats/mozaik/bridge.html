<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Connexion Mozaïk</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f3f2;color:#241719;margin:0;padding:28px}.box{max-width:520px;margin:auto;background:white;border:1px solid #eadedc;border-radius:18px;padding:24px;box-shadow:0 10px 28px rgba(74,20,25,.08)}h1{margin:0 0 10px;font-size:22px}.muted{color:#735e61;line-height:1.5}.ok{color:#17622d}.bad{color:#8f1621}.spinner{width:30px;height:30px;border:3px solid #eadedc;border-top-color:#8f1621;border-radius:50%;animation:s 1s linear infinite;margin:18px 0}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><h1>Synchronisation Mozaïk</h1><div id="spin" class="spinner"></div><p id="state" class="muted">Récupération du lot de synchronisation…</p></div><script>
const ENDPOINT='https://ojyswaxuqwnqilrvtjll.supabase.co/functions/v1/mozaik-sync';
const KEY='sb_publishable_mI94i3exzVPlHveGFX1WOw_1Ucab3_f';
const GITHUB_ORIGIN='https://techno-cardi.github.io';
const MOZAIK_ORIGIN='https://mozaikportail.ca';
const code=decodeURIComponent(location.hash.slice(1)).trim().toUpperCase();
const state=document.getElementById('state'),spin=document.getElementById('spin');
let job=null;
async function api(body){const r=await fetch(ENDPOINT,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw new Error(d.message||'Une erreur est survenue.');return d}
async function start(){try{if(!window.opener)throw new Error('Cette fenêtre doit être ouverte par le favori Synchroniser Mozaïk.');if(!code)throw new Error('Code de synchronisation manquant.');job=await api({action:'claim',code});state.textContent='Lot récupéré. En attente de Mozaïk…';window.opener.postMessage({type:'MOZAIK_SYNC_JOB',jobId:job.jobId,claimToken:job.claimToken,payload:job.payload},MOZAIK_ORIGIN)}catch(e){spin.style.display='none';state.className='bad';state.textContent=e.message}}
window.addEventListener('message',async e=>{if(e.origin!==MOZAIK_ORIGIN||e.source!==window.opener||!job||e.data?.type!=='MOZAIK_SYNC_COMPLETE')return;try{state.textContent='Enregistrement du résultat de la synchronisation…';const d=await api({action:'complete',jobId:job.jobId,claimToken:job.claimToken,success:e.data.success===true,activityId:e.data.activityId||'',competenceCode:e.data.competenceCode||'',syncedCount:e.data.syncedCount||0,message:e.data.message||''});spin.style.display='none';if(d.success){state.className='ok';state.innerHTML=`Synchronisation terminée.<br><strong>${d.syncedCount} note${d.syncedCount===1?'':'s'} synchronisée${d.syncedCount===1?'':'s'}.</strong><br><br>Tu peux fermer cette fenêtre.`}else{state.className='bad';state.textContent=d.message||'La synchronisation a échoué.'}}catch(err){spin.style.display='none';state.className='bad';state.textContent=err.message}});
start();
</script></body></html>
