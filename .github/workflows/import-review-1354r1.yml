name: Import tested Mozaik preview revision

on:
  push:
    branches: ['feat/mozaik-preview-review-1354']
    paths:
      - '.github/review-import/**'
      - '.github/workflows/import-review-1354r1.yml'

permissions:
  contents: write

jobs:
  import-tested:
    if: github.ref == 'refs/heads/feat/mozaik-preview-review-1354'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mozaik-preview-review-1354
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact baseline and patch hashes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 59b2a8827af6896b9a7fe825748acf1b4927a41d HEAD
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          allowed = {
            '.github/workflows/gestion-mozaik-checks.yml',
            'docs/superpowers/plans/2026-11-13-mozaik-review.md',
            'resultats/assignment-actions.js',
            'resultats/docs/CURRENT_STATE.md',
            'resultats/index.html',
            'resultats/mozaik-review.css',
            'resultats/mozaik-review.js',
            'resultats/tests/mozaik-review.test.cjs',
            'tests/browser/mozaik-review.py',
          }
          encoded = ''.join(pathlib.Path(f'.github/review-import/part{i}.b64').read_text().strip() for i in range(1, 5))
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == 'e179bd21f9db673687c55d7022d1c8a9141408a6d19fc53d80f0d9ff063e6b83', 'Transport checksum mismatch'
          bundle = json.loads(lzma.decompress(data))
          assert set(bundle['files']) == allowed, 'Unexpected file manifest'
          def blob(path):
            return subprocess.check_output(['git', 'hash-object', '--', path], text=True).strip()
          for name, hashes in bundle['files'].items():
            if hashes['before'] is None:
              assert not pathlib.Path(name).exists(), 'New path already exists: ' + name
            else:
              assert blob(name) == hashes['before'], 'Source changed: ' + name
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mozaik-review.patch'
          patch.write_text(bundle['patch'])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          for name, hashes in bundle['files'].items():
            assert blob(name) == hashes['after'], 'Output checksum mismatch: ' + name
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == allowed, 'Unexpected staged changes'
          print('Verified all 9 tested source files before and after patch.')
          PY
      - name: Validate executable source and offline contracts
        run: |
          node --check resultats/mozaik-review.js
          node --check resultats/assignment-actions.js
          node --test resultats/tests/mozaik-review.test.cjs resultats/tests/mozaik-weight-choice.test.cjs tests/resultats/mozaik-release-contract.test.cjs tests/resultats/mozaik-backend.test.cjs
      - name: Publish code to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          # Actions token cannot update workflows. The connector will publish the
          # already tested CI file and remove this temporary workflow separately.
          git restore --source=HEAD --staged --worktree .github/workflows/gestion-mozaik-checks.yml
          git rm .github/review-import/part1.b64 .github/review-import/part2.b64 .github/review-import/part3.b64 .github/review-import/part4.b64
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(gestion): clearer guarded Mozaik preview with tested display-only filters'
          git push origin HEAD:feat/mozaik-preview-review-1354
