name: Compiler Pause profil travail
on:
  push:
    branches:
      - build/pause-profil-travail-20261027
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pause-profil-travail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: PauseProfilTravail-APK
          path: pause-profil-travail/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
