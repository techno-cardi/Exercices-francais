name: Compiler Pause profil travail
on:
  push:
    branches:
      - build/pause-profil-travail-20261027
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pause-profil-travail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Vérifier les permissions de l'APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.MODIFY_QUIET_MODE'
      - name: Publier une URL HTTPS directe pour l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE="$GITHUB_WORKSPACE/pause-profil-travail/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$PACKAGE"
          mkdir -p "$RUNNER_TEMP/apk-download"
          cd "$RUNNER_TEMP/apk-download"
          git init -b apk-download
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp "$PACKAGE" PauseProfilTravail_S24Ultra_v5.apk
          sha256sum PauseProfilTravail_S24Ultra_v5.apk > SHA256SUMS.txt
          git add PauseProfilTravail_S24Ultra_v5.apk SHA256SUMS.txt
          git commit -m "Publier APK v5 silencieux vérifié"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/apk-download
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: PauseProfilTravail-v5-APK
          path: pause-profil-travail/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
