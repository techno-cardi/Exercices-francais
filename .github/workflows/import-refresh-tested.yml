name: Import tested catalogue refresh fix
on:
  push:
    branches: ['fix/import-refresh-1354']
    paths: ['.github/workflows/import-refresh-tested.yml']
permissions:
  contents: write
jobs:
  import-tested:
    if: github.ref == 'refs/heads/fix/import-refresh-1354'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-refresh-1354
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline, payload and resulting files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess,os
          raw=base64.b64decode(pathlib.Path('.github/import-refresh/payload.b64').read_text(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='cb5c483299b1d676f103fc5f858254e3a8d13b19450040304aff84214f440c43'
          bundle=json.loads(lzma.decompress(raw))
          assert bundle['base']=='6ee26b59f43d4c0e85063b336863254c50cd301d'
          subprocess.run(['git','merge-base','--is-ancestor',bundle['base'],'HEAD'],check=True)
          allowed={'docs/superpowers/plans/2026-11-13-import-refresh.md','resultats/app-patch-v05.js','resultats/app.js','resultats/docs/CURRENT_STATE.md','resultats/formative-integration.js','resultats/gestion-imports.js','resultats/index.html','resultats/tests/import-refresh.test.cjs','resultats/tests/student-grade-target.test.cjs','tests/browser/import-refresh.py','tests/resultats/formative-preview-ui.test.cjs','tests/resultats/gestion-imports-ui.test.cjs'}
          assert set(bundle['files'])==allowed
          def blob(name):return subprocess.check_output(['git','hash-object',name],text=True).strip()
          for name,hashes in bundle['files'].items():
            if hashes['before'] is None:assert not pathlib.Path(name).exists(),name
            else:assert blob(name)==hashes['before'],name
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'import-refresh.patch';patch.write_text(bundle['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name,hashes in bundle['files'].items():assert blob(name)==hashes['after'],name
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==allowed
          print('All twelve tested source files match exactly.')
          PY
      - name: Run import and catalogue regressions
        run: |
          node --check resultats/app.js
          node --check resultats/formative-integration.js
          node --check resultats/gestion-imports.js
          node --test resultats/tests/import-refresh.test.cjs tests/resultats/formative-preview-ui.test.cjs tests/resultats/gestion-imports-ui.test.cjs resultats/tests/student-grade-target.test.cjs
      - name: Publish validated code to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/import-refresh/payload.b64
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(gestion): show imported works immediately without browser reload'
          git push origin HEAD:fix/import-refresh-1354
