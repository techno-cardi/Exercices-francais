name: Import tested 1.3.54 feature branch
on:
  push:
    branches: ['feat/mozaik-maximum-alignement-1354']
    paths: ['tools/.1354-transfer-*.b64', '.github/workflows/import-tested-1354.yml']
permissions:
  contents: write
jobs:
  import-tested:
    if: github.repository == 'techno-cardi/Exercices-francais' && github.ref == 'refs/heads/feat/mozaik-maximum-alignement-1354'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact baseline, payload and changed blobs
        run: |
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib,json,subprocess
          encoded=''.join(pathlib.Path('tools/.1354-transfer-'+str(i)+'.b64').read_text().strip() for i in (1,2))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='f60ce921768bef0699e09a04a92492c58e8eeb63b0d17ec2ba0cceb2b5e05151','Transfer integrity failed'
          obj=json.loads(raw);base=obj['baseCommit']
          assert base=='c8e82a7dbf959eb235319319af10dafc0ab5a77d'
          paths=[]
          for f in obj['files']:
              p=pathlib.PurePosixPath(f['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert str(p).startswith(('resultats/','tests/resultats/','supabase/functions/mozaik-sync/','supabase/migrations/'))
              current=subprocess.run(['git','rev-parse','HEAD:'+str(p)],capture_output=True,text=True)
              assert (current.stdout.strip() if current.returncode==0 else None)==f['baseSha'],str(p)+' baseline changed'
              paths.append(str(p))
          patch=pathlib.Path('/tmp/cardinal-1354.patch');patch.write_text(obj['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          assert sorted(actual)==sorted(paths),'Unexpected modified paths'
          for f in obj['files']:
              value=pathlib.Path(f['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()==f['sha'],f['path']+' target mismatch'
          print('Verified',len(paths),'exact tested files; no production services contacted.')
          PY
      - name: Syntax and coordinated protocol regression
        run: |
          node --check resultats/assignment-actions.js
          node --check resultats/app-patch-v14.js
          node --check resultats/app-patch-v05.js
          node --experimental-strip-types --check supabase/functions/mozaik-sync/index.ts
          node --test resultats/tests/mozaik-weight-choice.test.cjs tests/resultats/mozaik-backend.test.cjs tests/resultats/mozaik-release-contract.test.cjs tests/resultats/mozaik-frontend.test.cjs
      - name: Isolated PostgreSQL validation
        run: |
          node resultats/tests/sql-setup.mjs
          node resultats/tests/sql-parameter-alignment.test.mjs
      - name: Commit only to the same feature branch and remove transport files
        run: |
          git rm tools/.1354-transfer-1.b64 tools/.1354-transfer-2.b64 .github/workflows/import-tested-1354.yml
          git config user.name 'Cardinal validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(mozaik): independently align weight and maximum with verified idempotent completion'
          git push origin HEAD:refs/heads/feat/mozaik-maximum-alignement-1354
