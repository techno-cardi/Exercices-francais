ête » désigne quoi ?","La [[fête]] commence ce soir.",["Un être","Un événement","Une manière","Un lien"],1,"Fête est un nom d’événement."],["Fonction","Le nom change-t-il de classe quand sa fonction change ?","[[Les élèves]] lisent. Je regarde [[les élèves]].",["Oui","Non","Seulement au pluriel","Seulement si un verbe suit"],1,"La classe reste la même; seul le rôle syntaxique du GN change."],["Forme","« chasse-neige » appartient à quelle classe ?","Le [[chasse-neige]] passe.",["Adjectif","Préposition","Nom","Verbe"],2,"Chasse-neige est un nom composé."],["Synthèse","Quel mot est le noyau du GN ?","Ces magnifiques [[montagnes]] enneigées.",["Ces","magnifiques","montagnes","enneigées"],2,"Montagnes est le nom noyau qui commande les accords."]]};</script><script src="laboratoire.js"></script></body></html>
